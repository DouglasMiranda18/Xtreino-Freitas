[build]
  publish = "artifacts/xtreino/public"
  command = "find artifacts/xtreino/public -name '*.html' -exec sed -i \"s|__FIREBASE_API_KEY__|$FIREBASE_API_KEY|g\" {} +"

[[redirects]]
  from = "/treinofreitas"
  to = "/evento.html"
  status = 200

[[redirects]]
  from = "/modoliga"
  to = "/evento.html"
  status = 200

[[redirects]]
  from = "/semanal"
  to = "/evento.html"
  status = 200

[[redirects]]
  from = "/campeonato"
  to = "/evento.html"
  status = 200
